[workspace]
resolver = "2"
members = [
    "node",
    "contracts/aethel_token",
    "contracts/aethel_core",
]

[workspace.dependencies]
# Common (optimized versions)
eyre = "0.6.12"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "sync", "macros"] } # Selective features for size
serde = { version = "1.0", features = ["derive"] }
config = "0.14"
hex = "0.4"
tracing = "0.1"
thiserror = "1.0"

# Stylus Contracts
stylus-sdk = { version = "0.6.0", features = ["export-abi"] }
alloy-primitives = "0.8.0"
alloy-sol-types = { version = "0.8.0", features = ["json"] }

# Node Application (optimized)
clap = { version = "4.5", features = ["derive"] }
ethers = { version = "2.0.14", default-features = false, features = ["ws", "rustls-tls"] } # Selective features
sha3 = "0.10.8"
shellexpand = "3.1.0"
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["fmt", "env-filter"] }
